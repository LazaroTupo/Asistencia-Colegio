version: "1"

services:
  # 1. Redis Cache
  - type: keyvalue
    name: redis-cache
    plan: free

  # 2. Evolution API
  - type: web
    name: evolution-api
    env: docker
    image: atendai/evolution-api:latest
    autoDeploy: false
    envVars:
      - key: SERVER_URL
        sync: false # Must be set to the Render URL (e.g., https://evolution-api-xxxx.onrender.com)
      - key: DOCKER_ENV
        value: "true"
      - key: LOG_LEVEL
        value: ERROR
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: "B6D711FCDE4D4FD5936544120E7139D5"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: asistencia-db
          property: connectionString
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          name: redis-cache
          type: keyvalue
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution

  # 3. Backend (Express API)
  - type: web
    name: backend
    env: node
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm start"
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString
      - key: EVOLUTION_API_URL
        sync: false # Must be set manually to the evolution-api Render URL
      - key: EVOLUTION_API_KEY
        value: "B6D711FCDE4D4FD5936544120E7139D5"
      - key: PORT
        value: "3000"

  # 4. Frontend (React/Vite)
  - type: web
    name: frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Must be set manually to the backend Render URL

databases:
  # 5. PostgreSQL Database
  - name: asistencia-db
    databaseName: asistencia_db
    user: admin
    plan: free
